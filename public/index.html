<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>우리집 작은 습관 정원 · 가족 실시간판</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#293145;background:#f8f7fc}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#ebe8f6;color:#352b62}button.primary{background:#6656c6;color:#fff}button:disabled{opacity:.5;cursor:wait}input:not([type=checkbox]),textarea{width:100%;border:1px solid #ddd7ef;border-radius:10px;padding:11px;background:#fff}label{font-size:14px}input[type=checkbox]{width:23px;height:23px;accent-color:#6858c6;flex-shrink:0}header{background:linear-gradient(125deg,#6255bd,#ac9cde);color:white;padding:22px max(16px,calc((100% - 1050px)/2))}header h1{margin:0;font-size:clamp(23px,4vw,34px)}header small{display:block;margin-top:6px}.wrap{max-width:1050px;margin:auto;padding:18px 12px 70px}.card{background:white;border-radius:18px;padding:19px;box-shadow:0 5px 24px #32295b0b;margin:14px 0}.card h2{margin:0 0 12px}.muted{color:#6d7381;font-size:13px;line-height:1.6}.tabs,.days,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.tabs button.active,.days button.active{background:#6656c6;color:#fff}.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.grow{flex:1}.character{font-size:52px}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eeeaf5}.task .grow{min-width:145px}.pill{background:#efecfa;color:#6253a2;padding:5px 9px;border-radius:20px;font-size:12px}.progress{height:12px;background:#eeeaf5;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,#69c9a9,#8175d8)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{background:#f5f3fb;border-radius:14px;padding:15px}.notice{background:#f6f4ff;border-radius:12px;padding:13px;line-height:1.6}.warn{background:#fff4e0}.success{background:#e8f8ef}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.daygrid>div{text-align:center;background:#fff;border-radius:8px;padding:9px 1px;font-size:12px}.item{padding:8px 0;border-bottom:1px solid #eee}.auth{max-width:520px;margin:20px auto}.auth input{margin:5px 0 13px}.reward{background:#f5f3fb;border-radius:10px;margin:6px 0;padding:9px}.record{font-size:13px}.pre{word-break:break-all;background:#f6f4fc;border-radius:9px;padding:10px;font-size:12px}.star{font-size:21px;color:#b4811a}.space{margin-top:14px}.hidden{display:none}.foot{font-size:12px;color:#777;text-align:center;margin-top:28px}.status{font-size:13px}button:focus-visible,input:focus-visible{outline:3px solid #c1b3f4}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.card{padding:14px}.task{gap:6px}.task .pill{display:none}.daygrid>div{font-size:11px}}
</style></head><body><header><h1>🌱 우리집 작은 습관 정원</h1><small>세 아이의 작은 실천이 가족에게 실시간으로 연결돼요</small></header><main class="wrap"><div id="status" class="status muted">앱을 준비하고 있어요.</div><div id="app"></div><div class="foot">아이들의 기록은 승인된 가족 계정만 열람할 수 있어요. · 실시간 연결에는 인터넷이 필요합니다.</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,collection,query,onSnapshot,getDoc,setDoc,addDoc,updateDoc,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {KIDS} from './kids.js';
// Firebase Console > 프로젝트 설정 > 내 앱(웹)의 값을 그대로 아래에 붙여 넣으세요.
const firebaseConfig={apiKey:'PASTE_API_KEY',authDomain:'PASTE_PROJECT_ID.firebaseapp.com',projectId:'PASTE_PROJECT_ID',appId:'PASTE_APP_ID'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayNames=['일','월','화','수','목','금','토'],weekOrder=[1,2,3,4,5,6,0];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>new Date(s+'T12:00:00'); const plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>plus(d,-((d.getDay()+6)%7)); const today=()=>iso(new Date());
let auth,db,unsubs=[],user=null,familyId='',member=null,family=null,members=[],checks=[],meetings={},selected=today(),tab='main',loading=false;
const status=t=>$('status').textContent=t;
const badConfig=Object.values(firebaseConfig).some(x=>String(x).includes('PASTE_'));
function error(e){console.error(e);let code=e?.code||'';let dictionary={'auth/email-already-in-use':'이미 등록된 이메일입니다. 로그인해 주세요.','auth/invalid-credential':'이메일이나 비밀번호가 맞지 않아요.','auth/weak-password':'비밀번호는 6자 이상 사용하세요.','auth/invalid-email':'이메일 형식을 확인하세요.','permission-denied':'접근 권한이 없어요. 가족 승인 및 Firestore 규칙을 확인하세요.'};alert(dictionary[code]||e.message||'오류가 발생했어요.')}
function cleanup(){unsubs.forEach(f=>f());unsubs=[];family=null;member=null;members=[];checks=[];meetings={}}
function ui(html){$('app').innerHTML=html;}
function formAuth(){status('가족 계정으로 로그인하세요.');ui(`<div class="auth card"><h2>🔐 우리 가족 로그인</h2><p class="muted">부모와 아이가 각각 다른 계정으로 접속합니다. 처음이라면 회원가입을 누르세요.</p><form id="authForm"><label>이메일</label><input id="email" type="email" required autocomplete="email"><label>비밀번호 (6자 이상)</label><input id="password" type="password" minlength="6" required autocomplete="current-password"><div class="actions"><button type="submit" class="primary" data-mode="login">로그인</button><button type="button" id="signup">새 계정 만들기</button></div></form><p class="muted">아이용 계정에는 부모가 관리할 수 있는 별도 이메일을 사용하세요. 아이의 실명은 입력하지 않아도 됩니다.</p></div>`);
 $('authForm').onsubmit=async e=>{e.preventDefault();await authenticate(false)}; $('signup').onclick=()=>authenticate(true);
}
async function authenticate(signup){let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){alert('이메일과 6자 이상 비밀번호를 입력하세요.');return}try{if(signup)await createUserWithEmailAndPassword(auth,email,password);else await signInWithEmailAndPassword(auth,email,password)}catch(e){error(e)}}
function familyLanding(){status('로그인됨 · 가족 연결 대기');ui(`<section class="card"><div class="flex"><h2 class="grow">👋 환영합니다</h2><button id="logout">로그아웃</button></div><p>이 계정의 사용자 ID</p><div class="pre">${esc(user.uid)}</div><div class="grid"><div class="notice"><h3>👨‍👩‍👧 부모라면</h3><p class="muted">가족 공간을 만든 후 아이의 사용자 ID를 등록하고 역할을 지정하세요.</p><button class="primary" id="createFamily">새 가족 만들기</button></div><div class="notice"><h3>🧒 아이라면</h3><p class="muted">부모에게 위 사용자 ID를 전달하고, 부모가 알려준 가족 ID를 입력하세요.</p><input id="familyInput" placeholder="부모가 알려준 가족 ID"><button id="joinFamily">가족 연결 확인</button></div></div><p class="muted">가족 ID만 안다고 접근할 수는 없습니다. 부모가 해당 사용자 ID를 승인한 후 연결됩니다.</p></section>`);
 $('logout').onclick=()=>signOut(auth); $('createFamily').onclick=createFamily; $('joinFamily').onclick=async()=>{let id=$('familyInput').value.trim();if(!id)return alert('가족 ID를 입력하세요.');try{let snap=await getDoc(doc(db,'families',id,'members',user.uid));if(!snap.exists())return alert('아직 부모의 승인이 필요해요. 부모 화면에서 사용자 ID를 등록해 주세요.');localStorage.setItem('habitFamilyId',id);listenFamily(id)}catch(e){error(e)}};
}
async function createFamily(){try{loading=true;let fref=doc(collection(db,'families'));await setDoc(fref,{ownerUid:user.uid,createdAt:serverTimestamp(),exam:false});await setDoc(doc(db,'families',fref.id,'members',user.uid),{role:'parent',kid:-1,joinedAt:serverTimestamp()});localStorage.setItem('habitFamilyId',fref.id);listenFamily(fref.id)}catch(e){error(e)}finally{loading=false}}
function listenFamily(id){cleanup();familyId=id;status('가족 정보를 연결하는 중…');unsubs.push(onSnapshot(doc(db,'families',id,'members',user.uid),s=>{if(!s.exists()){cleanup();familyId='';localStorage.removeItem('habitFamilyId');familyLanding();return}member=s.data();if(member.role==='parent'&&!unsubs.memberActive){unsubs.memberActive=true;unsubs.push(onSnapshot(collection(db,'families',id,'members'),list=>{members=list.docs.map(x=>({uid:x.id,...x.data()}));render()},error))}render();},error));unsubs.push(onSnapshot(doc(db,'families',id),s=>{family=s.data();render()},error));unsubs.push(onSnapshot(collection(db,'families',id,'checks'),s=>{checks=s.docs.map(x=>({id:x.id,...x.data()}));render()},error));unsubs.push(onSnapshot(collection(db,'families',id,'meetings'),s=>{meetings=Object.fromEntries(s.docs.map(x=>[x.id,x.data()]));render()},error));}
function isParent(){return member?.role==='parent'}
function available(k,t,d){return t[3].includes(parse(d).getDay())&&!(k===0&&family?.exam&&t[0]==='reading')}
function tasks(k,d){return KIDS[k].tasks.filter(t=>available(k,t,d))}
function checkId(k,d,t){return `${k}_${d}_${t}`}
function checkRecord(k,d,t){return checks.find(c=>c.id===checkId(k,d,t))}
function stars(k){return checks.filter(c=>c.kid===k&&c.status==='done').length}
function character(k){let s=stars(k);const sprites=[['🌱','🌿','🌼','🌻','🌳','🌲','🌈'],['🥚','🐣','🐥','🦊','🐺','🐯','🦁'],['🥚','🐰','🐇','🦋','🦄','🐉','👑']];return sprites[k][Math.min(6,Math.floor(s/20))]}
function stats(k,d){let ts=tasks(k,d),done=ts.filter(t=>checkRecord(k,d,t[0])?.status==='done').length,skip=ts.filter(t=>checkRecord(k,d,t[0])?.status==='skip').length;return {done,skip,total:ts.length}}
function picker(){let start=monday(parse(selected));return `<div class="days">${[0,1,2,3,4,5,6].map(i=>{let d=plus(start,i),s=iso(d);return `<button data-day="${s}" class="${s===selected?'active':''}">${dayNames[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</button>`}).join('')}</div>`}
function child(k){let st=stats(k,selected),pct=st.total?Math.round(100*(st.done+st.skip)/st.total):0,p=stars(k);return `<section class="card"><div class="flex"><span class="character">${character(k)}</span><div class="grow"><h2>${KIDS[k].color} ${['첫째','둘째','셋째'][k]}의 습관</h2><p class="muted">${KIDS[k].goal}<br>${KIDS[k].sleep}</p><div class="star">⭐ ${p}개 <span class="muted">· 성장 ${Math.min(7,Math.floor(p/20)+1)}/7 단계</span></div></div></div>${picker()}<div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="muted">오늘 완료 ${st.done}개 · 쉬어가기 ${st.skip}개 · 전체 ${st.total}개</p></section><section class="card"><h2>✅ 오늘의 미션</h2>${tasks(k,selected).map(t=>{let r=checkRecord(k,selected,t[0]);return `<div class="task"><input aria-label="${esc(t[1])}" type="checkbox" data-kid="${k}" data-task="${esc(t[0])}" ${r?.status==='done'?'checked':''}><div class="grow"><strong>${esc(t[1])}</strong><div class="muted">${esc(t[4])}</div></div><span class="pill">${esc(t[2])}</span><button data-skip="${esc(t[0])}" data-kid="${k}">${r?.status==='skip'?'↩ 다시 시작':'💤 쉬기'}</button></div>`}).join('')}<p class="notice">💚 다 하지 못한 날에도 괜찮아요. 내일 다시 시작할 수 있어요.</p></section><section class="card"><h2>🎁 나의 성장 보상</h2>${[5,10,20,40,60,90,120].map(n=>`<div class="reward">${p>=n?'✨':'🔒'} 별 ${n}개 · ${p>=n?'달성했어요!':'다음 도전'}</div>`).join('')}</section>`}
function parent(){let base=monday(parse(selected));return `<section class="card"><h2>👀 부모 대시보드 <span class="pill">실시간 연결</span></h2><p class="muted">아이별 실천 현황이 기기 간 자동 반영됩니다. 아이들끼리 순위를 매기지 않아요.</p>${picker()}<div class="stats">${[0,1,2].map(k=>{let all=[0,1,2,3,4,5,6].map(i=>stats(k,iso(plus(base,i)))),total=all.reduce((a,x)=>a+x.done,0);return `<div class="mini"><h3>${KIDS[k].color} ${['첫째 · 중2','둘째 · 초6','셋째 · 초3'][k]}</h3><div class="star">⭐ ${stars(k)}개</div><p>이번 주 ${total}개 실천</p><div class="daygrid">${all.map((s,i)=>`<div>${['월','화','수','목','금','토','일'][i]}<br><strong>${s.done}</strong>/${s.total}</div>`).join('')}</div></div>`}).join('')}</div></section><section class="card"><h2>🔗 기기 연결 관리</h2><p class="muted">가족 ID를 각 아이의 앱에 전달한 다음, 아이 화면에 표시되는 사용자 ID를 아래에 붙여 넣어 승인하세요.</p><p><strong>가족 ID</strong></p><div class="pre" id="familyCode">${esc(familyId)}</div><button data-copy="${esc(familyId)}">가족 ID 복사</button><div class="space grid"><div><label>아이 사용자 ID (28자 안팎)</label><input id="newUid" placeholder="아이 앱의 사용자 ID를 붙여 넣기"></div><div><label>어느 아이인가요?</label><select id="kidChoice" style="width:100%;padding:11px;border:1px solid #ddd7ef;border-radius:10px"><option value="0">첫째</option><option value="1">둘째</option><option value="2">셋째</option></select></div></div><div class="actions"><button class="primary" id="addMember">아이 계정 승인</button></div><h3>현재 연결된 계정</h3>${members.map(m=>`<div class="item">${m.role==='parent'?'👨‍👩‍👧 부모':KIDS[m.kid]?.color+' '+['첫째','둘째','셋째'][m.kid]} <span class="muted">${esc(m.uid)}</span></div>`).join('')}<p class="muted">아이당 한 계정만 승인하는 것을 추천합니다. 아이의 기기를 변경한 경우 새 계정을 승인할 수 있어요.</p></section><section class="card"><h2>⚙️ 가족 설정</h2><label><input type="checkbox" id="exam" ${family?.exam?'checked':''}> 첫째 시험기간 — 소설 미션 숨기기</label><p class="muted">수학학원과 학원 등·하원 시간은 실제 일정이 결정된 뒤 미션표에 반영하면 됩니다.</p></section>`}
function meeting(){let w=iso(monday(parse(selected))),m=meetings[w]||{};return `<section class="card"><h2>💬 일요일 10분 가족회의</h2><p class="muted">${w} 시작 주 · 서로 비교하지 않고 작은 성장을 함께 칭찬해요.</p><label>이번 주 잘한 점</label><textarea id="good" rows="3">${esc(m.good||'')}</textarea><label>조정할 점</label><textarea id="hard" rows="3">${esc(m.hard||'')}</textarea><label>다음 주 각자 정할 목표</label><textarea id="goals" rows="4">${esc(m.goals||'')}</textarea><div class="actions"><button class="primary" id="saveMeeting">회의 내용 저장</button></div><p class="notice">🎈 영화 선택권, 주말 자전거 코스, 가족 게임 선택권처럼 즐거운 경험을 보상으로 제안해 보세요.</p></section>`}
function render(){if(!user||!member||!family)return;status(`🟢 연결됨 · ${isParent()?'부모 계정':['첫째','둘째','셋째'][member.kid]+' 계정'} · 입력 즉시 자동 저장`);if(!isParent())tab='main';let nav=isParent()?`<div class="tabs"><button class="${tab==='main'?'active':''}" data-tab="main">📊 부모 기록</button>${[0,1,2].map(i=>`<button class="${tab===String(i)?'active':''}" data-tab="${i}">${KIDS[i].color} ${['첫째','둘째','셋째'][i]}</button>`).join('')}<button class="${tab==='meeting'?'active':''}" data-tab="meeting">💬 가족회의</button></div>`:'';ui(`<div class="flex"><span class="muted grow">${isParent()?'가족 관리자':'나의 습관 기록'} · 접속 중</span><button id="logout">로그아웃</button></div>${nav}${tab==='meeting'?meeting():tab==='main'&&isParent()?parent():child(isParent()?Number(tab):member.kid)}`);bind()}
function bind(){let o=$('logout');if(o)o.onclick=()=>signOut(auth);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;render()});document.querySelectorAll('[data-kid][data-task]').forEach(b=>b.onchange=()=>writeCheck(Number(b.dataset.kid),b.dataset.task,b.checked?'done':null));document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{let k=Number(b.dataset.kid),t=b.dataset.skip;writeCheck(k,t,checkRecord(k,selected,t)?.status==='skip'?null:'skip')});let c=document.querySelector('[data-copy]');if(c)c.onclick=()=>navigator.clipboard.writeText(familyId).then(()=>alert('가족 ID를 복사했어요.')).catch(()=>alert('복사할 수 없어요. 가족 ID를 직접 선택하세요.'));if($('addMember'))$('addMember').onclick=addMember;if($('exam'))$('exam').onchange=async e=>{try{await updateDoc(doc(db,'families',familyId),{exam:e.target.checked})}catch(err){error(err)}};if($('saveMeeting'))$('saveMeeting').onclick=async()=>{try{let w=iso(monday(parse(selected)));await setDoc(doc(db,'families',familyId,'meetings',w),{good:$('good').value,hard:$('hard').value,goals:$('goals').value,updatedAt:serverTimestamp()});alert('가족회의 기록이 가족 기기에 저장됐어요.')}catch(e){error(e)}}}
async function writeCheck(k,t,value){if(!(isParent()||member?.kid===k))return;let d=selected;try{let ref=doc(db,'families',familyId,'checks',checkId(k,d,t));await setDoc(ref,{kid:k,date:d,taskId:t,status:value||'clear',updatedBy:user.uid,updatedAt:serverTimestamp()});}catch(e){error(e)}}
async function addMember(){let uid=$('newUid').value.trim(),kid=Number($('kidChoice').value);if(!/^[A-Za-z0-9]{20,128}$/.test(uid))return alert('아이 화면에 표시된 사용자 ID 전체를 붙여 넣어주세요.');if(members.some(m=>m.role==='child'&&m.kid===kid&&m.uid!==uid)&&!confirm('이미 해당 아이 계정이 연결되어 있어요. 새 계정도 추가할까요?'))return;try{await setDoc(doc(db,'families',familyId,'members',uid),{role:'child',kid,joinedAt:serverTimestamp()});alert('아이 계정을 승인했어요. 아이 기기에서 가족 연결 확인을 눌러주세요.');$('newUid').value=''}catch(e){error(e)}}
if(badConfig){status('⚙️ 초기 설정이 필요합니다.');ui(`<section class="card notice warn"><h2>Firebase 연결 설정 전입니다</h2><p>이 앱은 실제 멀티기기 동기화가 가능한 완성 코드이지만, 사용자의 Firebase 프로젝트 설정값을 입력하고 인터넷에 게시해야 작동합니다.</p><p>동봉된 <strong>README.md</strong>를 따라 설정하세요. Firebase API 키는 로그인 비밀번호가 아니며, 접근 보호는 인증과 Firestore 보안 규칙이 담당합니다.</p></section>`)}else{try{let app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{cleanup();user=u;familyId='';if(!u){localStorage.removeItem('habitFamilyId');return formAuth()}let saved=localStorage.getItem('habitFamilyId');if(saved){try{let m=await getDoc(doc(db,'families',saved,'members',u.uid));if(m.exists()){listenFamily(saved);return}}catch(e){console.warn(e)}}familyLanding()})}catch(e){error(e)}}
</script></body></html>
